; SmallTV Deutsch/VVO v0.4.14.5.1
; Target: GeekMagic SmallTV-Ultra, ESP-12F / ESP8266, ST7789 240x240
;
; First build target:
;   pio run -e smalltv_ultra
;
; Firmware:
;   .pio/build/smalltv_ultra/firmware.bin
;
; License note:
; Hardware/display setup is based on the WTFPL-licensed smalltv-mod project.

[platformio]
default_envs = smalltv_ultra

[env:smalltv_ultra]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino

board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -D ARDUINOJSON_USE_DOUBLE=0
    -D ARDUINOJSON_POOL_CAPACITY=32
    -D ARDUINOJSON_AUTO_SHRINK=0

lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
    moononournation/GFX Library for Arduino @ 1.6.8
