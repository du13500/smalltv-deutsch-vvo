            Pixel size of the custom bitmap below, drawn centred at the
            icon spot. The hex string must match this size exactly: 24 px
            is 144 hex chars, 32 px is 256, and 48 px is 576. A mismatch
            makes the firmware silently skip the bitmap, so regenerate the
            hex with tools/mdi_to_hex.py at the same size you pick here.
            24 and 32 fit the ESP8266 payload limit; 48 only fits
            ESP32-family payloads, so on an ESP8266 a 48 px bitmap makes
            the whole message oversized and the firmware ignores it. For
            most cases pick 24 and use the scale below to draw it bigger.
          default: "24"
          selector:
            select:
              options:
                - "24"
                - "32"
                - "48"
        screen_3_bitmap_scale:
          name: Bitmap scale
          description: >-
            On-device upscale factor for the custom bitmap. The source
            bitmap stays small, so the payload stays under the ESP8266
            limit, and the device scales it up when drawing. Rendered size
            is bitmap size times scale: 24 px at scale 2 draws 48 px, the
            same footprint as the built-in icons. Keep size times scale at
            240 or less; the firmware skips anything bigger.
          default: "2"
          selector:
            select:
              options:
                - "1"
                - "2"
                - "3"
                - "4"
        screen_3_bitmap:
          name: Custom bitmap
          description: >-
            A 1-bit bitmap as a hex string, pasted from tools/mdi_to_hex.py
            in the repository; any Material Design Icons name converts.
            The hex length must match the bitmap size above: 144 chars for
            24 px, 256 for 32 px, 576 for 48 px. A mismatch makes the
            firmware silently skip the bitmap, so if you change the size,
            regenerate the hex at that same size. When set, the bitmap
            replaces both the icon template and the icon picker, drawn in
            the foreground colour. Clear it to fall back to the icon.
          default: ""
          selector:
            text:
              multiline: true
        screen_3_bitmap_tpl:
          name: Custom bitmap template
          description: >-
            Optional Jinja template that renders to a bitmap hex string, for
            example from tools/mdi_to_hex.py, so the bitmap can switch by
            state:
            {{ '<hex A>' if is_state('binary_sensor.window','on') else '<hex B>' }}.
            When it renders non-empty it wins over the static bitmap field
            above; when it renders empty, the pasted bitmap is used. The
            bitmap size still comes from the size picker, and the rendered
            hex length must match it exactly (144 chars for 24 px, 256 for
            32 px, 576 for 48 px) or the firmware silently skips the
            bitmap.
          default: ""
          selector:
            template:
        screen_3_icon_y:
          name: Icon vertical position
          description: >-
            Top edge of the icon or custom bitmap, in pixels from the top.
            The drawn height below this line is 24 times the icon size, or
            bitmap size times bitmap scale: 24 px at scale 2 draws 48 px.
            The default 30 recreates the classic layout.
          default: 30
          selector:
            number:
              min: 0
              max: 200
              step: 2
              mode: slider
        screen_3_icon_size:
          name: Icon size
          description: >-
            Scale of the built-in vector icon, 1 to 4. The icon occupies a
            box of 24 times this size in pixels, so the default 2 draws 48
            px. Custom bitmaps ignore this and use their own size times
            scale.
          default: 2
          selector:
            number:
              min: 1
              max: 4
              step: 1
              mode: slider
        screen_3_color:
          name: Foreground colour
          description: Icon and text colour, as #RRGGBB.
          default: "#FFFFFF"
          selector:
            text:
        screen_3_color_tpl:
          name: Foreground colour template
          description: >-
            Optional Jinja template that renders to a #RRGGBB colour, for
            example
            {{ '#FF0000' if states('sensor.temp') | float(0) > 28 else '#FFFFFF' }}.
            When set it wins over the static colour; when it renders empty,
            the static colour is used. A malformed colour makes the device
            skip the primitive instead of breaking the screen.
          default: ""
          selector:
            template:
        screen_3_bg:
          name: Background colour
          description: Screen background, as #RRGGBB.
          default: "#000000"
          selector:
            text:
        screen_3_bg_tpl:
          name: Background colour template
          description: >-
            Optional Jinja template that renders to a #RRGGBB background.
            When set it wins over the static background; when it renders
            empty, the static background is used. A malformed colour is
            ignored by the device.
          default: ""
          selector:
            template:
        screen_3_slot:
          name: Screen slot
          description: >-
            The carousel slot this screen occupies. Slots sort
            lexicographically, and slot order is the carousel order, so pick a
            name that sorts where you want the screen. Slot names must be
            unique per device across ALL automations and blueprints writing to
            the same hostname: two publishers on one slot overwrite each
            other.
          default: s3
          selector:
            text:
    screen_4_section:
      name: Screen 4
      collapsed: true
      input:
        screen_4_entity:
          name: Entity
          description: >-
            Any entity, any domain. Leave empty to disable this screen,
            unless a value template below is set.
          default: ""
          selector:
            entity:
        screen_4_title:
          name: Title
          description: Leave empty to use the entity's friendly name.
          default: ""
          selector:
            text:
        screen_4_title_tpl:
          name: Title template
          description: >-
            Optional Jinja template for the title line, for example
            Outside {{ states('sensor.outside_temperature') }}°. When set it
            wins over the static title, which still falls back to the
            entity's friendly name. The rendered title scales down to fit
            the panel like any other text. Leave empty to keep the static
            title.
          default: ""
          selector:
            template:
        screen_4_title_y:
          name: Title vertical position
          description: >-
            Top edge of the title line, in pixels from the top. The default
            110 recreates the classic layout.
          default: 110
          selector:
            number:
              min: 0
              max: 220
              step: 2
              mode: slider
        screen_4_title_min_size:
          name: Title minimum text size
          description: >-
            Smallest text scale for the title, 1 to 4. A title that does
            not fit even at this size is cut to fit instead of shrinking
            further. The defaults 1 to 2 recreate the classic layout.
          default: 1
          selector:
            number:
              min: 1
              max: 4
              step: 1
              mode: slider
        screen_4_title_max_size:
          name: Title maximum text size
          description: >-
            Biggest text scale allowed for the title, 1 to 4. The title
            stays on one line: it uses the largest size in this range that
            fits, and longer text is cut. The default 2 recreates the
            classic layout.
          default: 2
          selector:
            number:
              min: 1
              max: 4
              step: 1
              mode: slider
        screen_4_value_tpl:
          name: Value template
          description: >-
            Optional Jinja template for the big value line. When set, its
            rendered result replaces the default state-plus-unit text, so
            you can combine sensors or show anything Home Assistant can
            template, for example
            {{ states('sensor.indoor') }}° / {{ states('sensor.outdoor') }}°.
            The text scales down within the size range below and wraps onto
            multiple lines when it gets long. Leave empty to keep the
            entity's state.
          default: ""
          selector:
            template:
        screen_4_value_max_size:
          name: Value maximum text size
          description: >-
            Biggest text scale allowed for the value line, 1 to 4. The
            blueprint picks the largest size in this range that still fits
            the text on one line.
          default: 4
          selector:
            number:
              min: 1
              max: 4
              step: 1
              mode: slider
        screen_4_value_min_size:
          name: Value minimum text size
          description: >-
            Smallest text scale for the value line, 1 to 4. Text that does
            not fit on one line even at this size wraps onto multiple lines
            at this size instead of shrinking further or being cut.
          default: 1
          selector:
            number:
              min: 1
              max: 4
              step: 1
              mode: slider
        screen_4_value_y:
          name: Value vertical position
          description: >-
            Top edge of the value block, in pixels from the top. Wrapped
            value lines flow down from here, so the lower the start, the
            fewer lines fit. The default 150 recreates the classic layout.
          default: 150
          selector:
            number:
              min: 0
              max: 220
              step: 2
              mode: slider
        screen_4_icon:
          name: Icon
          description: Optional icon drawn centred at the top of the screen.
          default: none
          selector:
            select:
              options:
                - none
                - thermometer
                - humidity
                - sun
                - cloud
                - rain
