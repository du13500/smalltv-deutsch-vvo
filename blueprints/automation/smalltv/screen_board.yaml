blueprint:
  name: SmallTV screen board
  description: >-
    Publishes up to four sensor screens to a SmallTV running smalltv-mod,
    one retained MQTT message per slot, and the device rotates through them
    in the carousel. Each screen shows an optional icon on top, a title,
    and a big value line that defaults to the entity's state with its
    unit. Every part of a screen can also be driven by a Jinja template:
    value, icon, foreground, and background each have an optional template
    that wins over the static input when set. With the templates filled
    in, one screen works like a small Lovelace card, combining sensors
    and switching icon and colour by state. A screen with no entity and
    no value template is skipped. The publishes are retained, so the
    device keeps the screens across reboots, and a startup trigger
    republishes them after every Home Assistant restart. Screens also
    carry a time-to-live, so deleting this automation makes them expire
    on their own instead of staying on the broker forever.
  domain: automation
  source_url: https://github.com/giovi321/smalltv-mod/blob/main/blueprints/automation/smalltv/screen_board.yaml
  homeassistant:
    min_version: 2024.6.0
  input:
    hostname:
      name: Device hostname
      description: >-
        The SmallTV's hostname, as shown in its web UI. It is the device id in
        every MQTT topic, for example "smalltv".
      selector:
        text:
    watched_entities:
      name: Watched entities
      description: >-
        Every entity used by the screens below, including every entity named
        inside any template. A state change on any of them republishes the
        whole board instantly, so list them all here once instead of per
        screen. An entity that only appears in a template and is not listed
        here leaves its screen refreshing on the one-minute timer only.
      default: []
      selector:
        entity:
          multiple: true
    screen_ttl:
      name: Screen time-to-live
      description: >-
        Seconds a screen stays in the rotation after its last publish.
        The one-minute refresh keeps every screen alive while this
        automation exists, so while you change nothing the TTL never runs
        out. Delete the automation and each screen vanishes from the
        device within this time. A stale copy can briefly reappear after
        a device reboot because the broker still holds the retained
        message; the device then expires it again on the same clock. The
        remaining time survives reboots, so the countdown is not reset by
        a power cycle. Set 0 to show forever: the old behaviour, where
        screens only go away when you publish an empty payload or press
        the device's Clear screens button.
      default: 900
      selector:
        number:
          min: 0
          max: 86400
          step: 60
          unit_of_measurement: s
          mode: slider
    screen_1_section:
      name: Screen 1
      collapsed: true
      input:
        screen_1_entity:
          name: Entity
          description: >-
            Any entity, any domain. Leave empty to disable this screen,
            unless a value template below is set.
          default: ""
          selector:
            entity:
        screen_1_title:
          name: Title
          description: Leave empty to use the entity's friendly name.
          default: ""
          selector:
            text:
        screen_1_title_tpl:
          name: Title template
          description: >-
            Optional Jinja template for the title line, for example
            Outside {{ states('sensor.outside_temperature') }}°. When set it
            wins over the static title, which still falls back to the
            entity's friendly name. The rendered title scales down to fit
            the panel like any other text. Leave empty to keep the static
            title.
          default: ""
          selector:
            template:
        screen_1_value_tpl:
          name: Value template
          description: >-
            Optional Jinja template for the big value line. When set, its
            rendered result replaces the default state-plus-unit text, so
            you can combine sensors or show anything Home Assistant can
            template, for example
            {{ states('sensor.indoor') }}° / {{ states('sensor.outdoor') }}°.
            The text scales down within the size range below and wraps onto
            multiple lines when it gets long. Leave empty to keep the
            entity's state.
          default: ""
          selector:
            template:
        screen_1_value_max_size:
          name: Value maximum text size
          description: >-
            Biggest text scale allowed for the value line, 1 to 4. The
            blueprint picks the largest size in this range that still fits
            the text on one line.
          default: 4
          selector:
            number:
              min: 1
              max: 4
              step: 1
              mode: slider
        screen_1_value_min_size:
          name: Value minimum text size
          description: >-
            Smallest text scale for the value line, 1 to 4. Text that does
            not fit on one line even at this size wraps onto multiple lines
            at this size instead of shrinking further or being cut.
          default: 1
          selector:
            number:
              min: 1
              max: 4
              step: 1
              mode: slider
        screen_1_icon:
          name: Icon
          description: Optional icon drawn centred at the top of the screen.
          default: none
          selector:
            select:
              options:
                - none
                - thermometer
                - humidity
                - sun
                - cloud
                - rain
                - snow
                - wind
                - home
                - door-open
                - door-closed
                - window-open
                - window-closed
                - motion
                - plug
                - battery
                - alert
                - check
                - x
                - arrow-up
                - arrow-down
        screen_1_icon_tpl:
          name: Icon template
          description: >-
            Optional Jinja template that renders to an icon name, for
            state-based icons. Example:
            {{ 'window-open' if is_state('binary_sensor.window', 'on') else 'window-closed' }}.
            When set it wins over the icon picker above; when it renders
            empty, the picker value is used. An unknown name draws no icon,
            so a bad template degrades gracefully.
          default: ""
          selector:
            template:
        screen_1_bitmap_size:
          name: Bitmap size
          description: >-
            Pixel size of the custom bitmap below, drawn centred at the
            icon spot. 24 and 32 fit the ESP8266 payload limit; 48 only
            fits ESP32-family payloads, so on an ESP8266 a 48 px bitmap
            makes the whole message oversized and the firmware ignores it.
          default: "24"
          selector:
            select:
              options:
                - "24"
                - "32"
                - "48"
        screen_1_bitmap:
          name: Custom bitmap
          description: >-
            A 1-bit bitmap as a hex string, pasted from tools/mdi_to_hex.py
            in the repository; any Material Design Icons name converts.
            When set, the bitmap replaces both the icon template and the
            icon picker, drawn in the foreground colour. Clear it to fall
            back to the icon.
          default: ""
          selector:
            text:
              multiline: true
        screen_1_bitmap_tpl:
          name: Custom bitmap template
          description: >-
            Optional Jinja template that renders to a bitmap hex string, for
            example from tools/mdi_to_hex.py, so the bitmap can switch by
            state:
            {{ '<hex A>' if is_state('binary_sensor.window','on') else '<hex B>' }}.
            When it renders non-empty it wins over the static bitmap field
            above; when it renders empty, the pasted bitmap is used. The
            bitmap size still comes from the size picker, so keep the hex
            length matched to it.
          default: ""
          selector:
            template:
        screen_1_color:
          name: Foreground colour
          description: Icon and text colour, as #RRGGBB.
          default: "#FFFFFF"
          selector:
            text:
        screen_1_color_tpl:
          name: Foreground colour template
          description: >-
            Optional Jinja template that renders to a #RRGGBB colour, for
            example
            {{ '#FF0000' if states('sensor.temp') | float(0) > 28 else '#FFFFFF' }}.
            When set it wins over the static colour; when it renders empty,
            the static colour is used. A malformed colour makes the device
            skip the primitive instead of breaking the screen.
          default: ""
          selector:
            template:
        screen_1_bg:
          name: Background colour
          description: Screen background, as #RRGGBB.
          default: "#000000"
          selector:
            text:
        screen_1_bg_tpl:
          name: Background colour template
          description: >-
            Optional Jinja template that renders to a #RRGGBB background.
            When set it wins over the static background; when it renders
            empty, the static background is used. A malformed colour is
            ignored by the device.
          default: ""
          selector:
            template:
        screen_1_slot:
          name: Screen slot
          description: >-
            The carousel slot this screen occupies. Slots sort
            lexicographically, and slot order is the carousel order, so pick a
            name that sorts where you want the screen. Slot names must be
            unique per device across ALL automations and blueprints writing to
            the same hostname: two publishers on one slot overwrite each
            other.
          default: s1
          selector:
            text:
