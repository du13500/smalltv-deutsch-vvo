        {% set v = states(e) ~ (' ' ~ u if u != '' else '') -%}
        {"bg":{{ screen_3_bg | tojson }},"ttl":0,"draw":[
        {%- if screen_3_icon != 'none' -%}
        {"t":"icon","x":120,"y":30,"s":2,"c":{{ screen_3_color | tojson }},"a":"c","v":{{ screen_3_icon | tojson }}},
        {%- endif -%}
        {"t":"text","x":120,"y":110,"s":2,"c":{{ screen_3_color | tojson }},"a":"c","v":{{ title | tojson }}},
        {"t":"text","x":120,"y":150,"s":4,"c":{{ screen_3_color | tojson }},"a":"c","v":{{ v | tojson }}}
        ]}
  - condition: template
    value_template: >-
