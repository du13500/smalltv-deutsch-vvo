          description: >-
            The carousel slot this screen occupies. Slots sort
            lexicographically, and slot order is the carousel order, so pick a
            name that sorts where you want the screen. Slot names must be
            unique per device across ALL automations and blueprints writing to
            the same hostname: two publishers on one slot overwrite each
            other.
          default: s4
          selector:
            text:

# Hoist !input values into variables before templating: !input is only legal
# at the top level of trigger/condition/action keys, not inside a template.
# The template-selector inputs hold Jinja source, and hoisting them into
# variables renders them once per run, so below each screen_i_*_tpl variable
# is the rendered result (empty string when the input was left empty).
variables:
  hostname: !input hostname
  watched_entities: !input watched_entities
  screen_ttl: !input screen_ttl
  screen_1_entity: !input screen_1_entity
  screen_1_title: !input screen_1_title
  screen_1_title_tpl: !input screen_1_title_tpl
  screen_1_value_tpl: !input screen_1_value_tpl
  screen_1_value_max_size: !input screen_1_value_max_size
  screen_1_value_min_size: !input screen_1_value_min_size
  screen_1_icon: !input screen_1_icon
  screen_1_icon_tpl: !input screen_1_icon_tpl
  screen_1_bitmap_size: !input screen_1_bitmap_size
  screen_1_bitmap: !input screen_1_bitmap
  screen_1_bitmap_tpl: !input screen_1_bitmap_tpl
  screen_1_color: !input screen_1_color
  screen_1_color_tpl: !input screen_1_color_tpl
  screen_1_bg: !input screen_1_bg
  screen_1_bg_tpl: !input screen_1_bg_tpl
  screen_1_slot: !input screen_1_slot
  screen_2_entity: !input screen_2_entity
  screen_2_title: !input screen_2_title
  screen_2_title_tpl: !input screen_2_title_tpl
  screen_2_value_tpl: !input screen_2_value_tpl
  screen_2_value_max_size: !input screen_2_value_max_size
  screen_2_value_min_size: !input screen_2_value_min_size
  screen_2_icon: !input screen_2_icon
  screen_2_icon_tpl: !input screen_2_icon_tpl
  screen_2_bitmap_size: !input screen_2_bitmap_size
  screen_2_bitmap: !input screen_2_bitmap
  screen_2_bitmap_tpl: !input screen_2_bitmap_tpl
  screen_2_color: !input screen_2_color
  screen_2_color_tpl: !input screen_2_color_tpl
  screen_2_bg: !input screen_2_bg
  screen_2_bg_tpl: !input screen_2_bg_tpl
  screen_2_slot: !input screen_2_slot
  screen_3_entity: !input screen_3_entity
  screen_3_title: !input screen_3_title
  screen_3_title_tpl: !input screen_3_title_tpl
  screen_3_value_tpl: !input screen_3_value_tpl
  screen_3_value_max_size: !input screen_3_value_max_size
  screen_3_value_min_size: !input screen_3_value_min_size
  screen_3_icon: !input screen_3_icon
  screen_3_icon_tpl: !input screen_3_icon_tpl
  screen_3_bitmap_size: !input screen_3_bitmap_size
  screen_3_bitmap: !input screen_3_bitmap
  screen_3_bitmap_tpl: !input screen_3_bitmap_tpl
  screen_3_color: !input screen_3_color
  screen_3_color_tpl: !input screen_3_color_tpl
  screen_3_bg: !input screen_3_bg
  screen_3_bg_tpl: !input screen_3_bg_tpl
  screen_3_slot: !input screen_3_slot
  screen_4_entity: !input screen_4_entity
  screen_4_title: !input screen_4_title
  screen_4_title_tpl: !input screen_4_title_tpl
  screen_4_value_tpl: !input screen_4_value_tpl
  screen_4_value_max_size: !input screen_4_value_max_size
  screen_4_value_min_size: !input screen_4_value_min_size
  screen_4_icon: !input screen_4_icon
  screen_4_icon_tpl: !input screen_4_icon_tpl
  screen_4_bitmap_size: !input screen_4_bitmap_size
  screen_4_bitmap: !input screen_4_bitmap
  screen_4_bitmap_tpl: !input screen_4_bitmap_tpl
  screen_4_color: !input screen_4_color
  screen_4_color_tpl: !input screen_4_color_tpl
  screen_4_bg: !input screen_4_bg
  screen_4_bg_tpl: !input screen_4_bg_tpl
  screen_4_slot: !input screen_4_slot

mode: restart

triggers:
  - trigger: state
    entity_id: !input watched_entities
  # Safety refresh: if a state change was missed (or the broker was restarted
  # and lost the retained messages), the screens are republished within a
  # minute. Retained publishes are cheap.
  - trigger: time_pattern
    minutes: "/1"
  # Republish the retained screens after every Home Assistant restart.
  - trigger: homeassistant
    event: start

conditions:
  # Do nothing at all until a hostname is configured.
  - condition: template
    value_template: "{{ hostname != '' }}"

actions:
  # A screen publishes when its entity is set and reporting, or when a value
  # template is set (template-driven screens need no entity at all).
  - condition: template
    value_template: >-
      {{ (screen_1_entity != ''
          and states(screen_1_entity) not in ('unknown', 'unavailable', 'none'))
         or screen_1_value_tpl != '' }}
  - action: mqtt.publish
    data:
      topic: "smalltv/{{ hostname }}/screen/{{ screen_1_slot }}"
      retain: true
      payload: >-
        {% set e = screen_1_entity -%}
        {% set title = screen_1_title_tpl if screen_1_title_tpl != '' else (screen_1_title if screen_1_title != '' else (state_attr(e, 'friendly_name') if e != '' else '')) -%}
        {% set icon = screen_1_icon_tpl if screen_1_icon_tpl != '' else screen_1_icon -%}
        {% set bm_tpl = screen_1_bitmap_tpl | trim -%}
        {% set bm = bm_tpl if bm_tpl != '' else (screen_1_bitmap | trim) -%}
        {% set bs = screen_1_bitmap_size | int(24) -%}
        {% set color = screen_1_color_tpl if screen_1_color_tpl != '' else screen_1_color -%}
        {% set bg = screen_1_bg_tpl if screen_1_bg_tpl != '' else screen_1_bg -%}
        {% set vmin = screen_1_value_min_size | int(1) -%}
        {% set vmax = screen_1_value_max_size | int(4) -%}
        {% if screen_1_value_tpl != '' -%}
        {% set v = screen_1_value_tpl -%}
        {% else -%}
        {% set u = state_attr(e, 'unit_of_measurement') or '' -%}
        {% set v = states(e) ~ (' ' ~ u if u != '' else '') -%}
        {% endif -%}
        {# Value line: 232 px budget (width is length * 6 * scale). Pick the
           largest scale in [lo..hi] that fits one line. Longer text wraps at
           lo onto at most 4 lines, pitch 8*lo + 2, starting at y=150. -#}
        {% set lo = [vmin, vmax] | min -%}
        {% set hi = [vmin, vmax] | max -%}
        {% set v = v | truncate(150, True, '', 0) -%}
        {% set fit = namespace(s=0) -%}
        {% for cand in range(hi, lo - 1, -1) -%}
        {% if fit.s == 0 and v | length * 6 * cand <= 232 -%}
        {% set fit.s = cand -%}
        {% endif -%}
        {% endfor -%}
        {% if fit.s > 0 -%}
        {% set vs = fit.s -%}
        {% set vlines = [v] -%}
        {% else -%}
        {% set vs = lo -%}
        {% set w = 232 // (6 * lo) -%}
        {% set vlines = (v | wordwrap(w, true, '\n')).split('\n') -%}
        {% set vlines = vlines[:[4, 86 // (8 * lo + 2)] | min] -%}
        {% set vlines = vlines[:-1] + [vlines | last | truncate(w, True, '', 0)] -%}
        {% endif -%}
        {# Title stays one line: scale 2, else 1, then cut. -#}
        {% set ts = 2 if title | length <= 19 else 1 -%}
        {% set title = title | truncate(232 // (6 * ts), True, '', 0) -%}
        {"bg":{{ bg | tojson }},"ttl":{{ screen_ttl | int(900) }},"draw":[
        {%- if bm != '' -%}
        {"t":"bitmap","x":120,"y":30,"w":{{ bs }},"h":{{ bs }},"c":{{ color | tojson }},"a":"c","d":{{ bm | tojson }}},
        {%- elif icon != 'none' and icon != '' -%}
        {"t":"icon","x":120,"y":30,"s":2,"c":{{ color | tojson }},"a":"c","v":{{ icon | tojson }}},
        {%- endif -%}
        {"t":"text","x":120,"y":110,"s":{{ ts }},"c":{{ color | tojson }},"a":"c","v":{{ title | tojson }}},
        {%- for line in vlines -%}
        {"t":"text","x":120,"y":{{ 150 + loop.index0 * (8 * vs + 2) }},"s":{{ vs }},"c":{{ color | tojson }},"a":"c","v":{{ line | tojson }}}{{ ',' if not loop.last else '' }}
        {%- endfor -%}
        ]}
  - condition: template
    value_template: >-
      {{ (screen_2_entity != ''
          and states(screen_2_entity) not in ('unknown', 'unavailable', 'none'))
         or screen_2_value_tpl != '' }}
