blueprint:
  name: SmallTV screen board
  description: >-
    Publishes up to four sensor screens to a SmallTV running smalltv-mod,
    one retained MQTT message per slot, and the device rotates through them
    in the carousel. Each screen shows an optional icon on top, a title, and
    the entity's state with its unit. All four screens are generic, so any
    entity domain works. A screen with no entity set is skipped. The
    publishes are retained, so the device keeps the screens across reboots,
    and a startup trigger republishes them after every Home Assistant
    restart.
  domain: automation
  source_url: https://github.com/giovi321/smalltv-mod/blob/main/blueprints/automation/smalltv/screen_board.yaml
  homeassistant:
    min_version: 2024.6.0
  input:
    hostname:
      name: Device hostname
      description: >-
        The SmallTV's hostname, as shown in its web UI. It is the device id in
        every MQTT topic, for example "smalltv".
      selector:
        text:
    watched_entities:
      name: Watched entities
      description: >-
        Every entity used by the screens below. A state change on any of them
        republishes the whole board instantly, so list them all here once
        instead of per screen.
      default: []
      selector:
        entity:
          multiple: true
    screen_1_section:
      name: Screen 1
      collapsed: true
      input:
        screen_1_entity:
          name: Entity
          description: Any entity, any domain. Leave empty to disable this screen.
          default: ""
          selector:
            entity:
        screen_1_title:
          name: Title
          description: Leave empty to use the entity's friendly name.
          default: ""
          selector:
            text:
        screen_1_icon:
          name: Icon
          description: Optional icon drawn centred at the top of the screen.
          default: none
          selector:
            select:
              options:
                - none
                - thermometer
                - humidity
                - sun
                - cloud
                - rain
                - snow
                - wind
                - home
                - door-open
                - door-closed
                - window-open
                - window-closed
                - motion
                - plug
                - battery
                - alert
                - check
                - x
                - arrow-up
                - arrow-down
        screen_1_color:
          name: Foreground colour
          description: Icon and text colour, as #RRGGBB.
          default: "#FFFFFF"
          selector:
            text:
        screen_1_bg:
          name: Background colour
          description: Screen background, as #RRGGBB.
          default: "#000000"
          selector:
            text:
        screen_1_slot:
          name: Screen slot
          description: >-
            The carousel slot this screen occupies. Slots sort
            lexicographically, and slot order is the carousel order, so pick a
            name that sorts where you want the screen. Slot names must be
            unique per device across ALL automations and blueprints writing to
            the same hostname: two publishers on one slot overwrite each
            other.
          default: s1
          selector:
            text:
    screen_2_section:
      name: Screen 2
      collapsed: true
      input:
        screen_2_entity:
          name: Entity
          description: Any entity, any domain. Leave empty to disable this screen.
          default: ""
          selector:
            entity:
        screen_2_title:
          name: Title
          description: Leave empty to use the entity's friendly name.
