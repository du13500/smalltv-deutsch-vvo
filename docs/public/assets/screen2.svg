<svg xmlns="http://www.w3.org/2000/svg" width="868" height="320" viewBox="0 0 868 320" font-family="Consolas,Menlo,monospace">
  <rect width="868" height="320" fill="#0e1116"/>

  <!-- Panel 4: Home Assistant screen (MQTT draw list, blueprint layout) -->
  <g transform="translate(20,20)">
    <rect width="260" height="260" rx="22" fill="#1b2029" stroke="#2b323d"/>
    <rect x="10" y="10" width="240" height="240" rx="10" fill="#1a1a1a"/>
    <g transform="translate(10,10)">
      <!-- thermometer icon: 24x24 grid, s=2, box at (96,30) -->
      <rect x="116" y="34" width="8" height="28" fill="#ffcc00"/>
      <circle cx="120" cy="64" r="10" fill="#ffcc00"/>
      <text x="120" y="124" fill="#ffcc00" font-size="22" text-anchor="middle">Living room</text>
      <text x="120" y="178" fill="#ffcc00" font-size="44" text-anchor="middle">21.4 °C</text>
    </g>
    <text x="130" y="290" fill="#8b96a5" font-size="14" text-anchor="middle">Home Assistant</text>
  </g>

  <!-- Panel 5: notification overlay -->
  <g transform="translate(304,20)">
    <rect width="260" height="260" rx="22" fill="#1b2029" stroke="#2b323d"/>
    <rect x="10" y="10" width="240" height="240" rx="10" fill="#000"/>
    <g transform="translate(10,10)">
      <!-- outline emanating from the sign, two phases of the animation -->
      <polygon points="120,27 26,183 214,183" fill="none" stroke="#2b2b00" stroke-width="4"/>
      <polygon points="120,35 34,175 206,175" fill="none" stroke="#808000" stroke-width="4"/>
      <!-- the sign itself never moves and never changes colour -->
      <polygon points="120,41 40,169 200,169" fill="#ffff00"/>
      <rect x="113" y="76" width="14" height="49" fill="#000"/>
      <rect x="113" y="139" width="14" height="14" fill="#000"/>
      <text x="120" y="231" fill="#ffff00" font-size="20" text-anchor="middle">Freezer door open</text>
    </g>
    <text x="130" y="290" fill="#8b96a5" font-size="14" text-anchor="middle">Notification</text>
  </g>

  <!-- Panel 6: portfolio summary page -->
  <g transform="translate(588,20)">
    <rect width="260" height="260" rx="22" fill="#1b2029" stroke="#2b323d"/>
    <rect x="10" y="10" width="240" height="240" rx="10" fill="#000"/>
    <g transform="translate(10,10)">
      <circle cx="94" cy="9" r="2" fill="#39414d"/>
      <circle cx="104" cy="9" r="2" fill="#39414d"/>
      <circle cx="114" cy="9" r="2" fill="#39414d"/>
      <circle cx="124" cy="9" r="2" fill="#39414d"/>
      <circle cx="134" cy="9" r="2" fill="#39414d"/>
      <circle cx="144" cy="9" r="2" fill="#ffffff"/>
      <text x="120" y="47" fill="#e6edf3" font-size="33" text-anchor="middle">Portfolio</text>

      <text x="4" y="72" fill="#e6edf3" font-size="20">AAPL</text>
      <text x="104" y="72" fill="#3fb950" font-size="20">+12.4%</text>
      <text x="236" y="72" fill="#e6edf3" font-size="20" text-anchor="end">4690</text>

      <text x="4" y="90" fill="#e6edf3" font-size="20">MSFT</text>
      <text x="104" y="90" fill="#3fb950" font-size="20">+5.1%</text>
      <text x="236" y="90" fill="#e6edf3" font-size="20" text-anchor="end">3115</text>

      <text x="4" y="108" fill="#e6edf3" font-size="20">NVDA</text>
      <text x="104" y="108" fill="#f85149" font-size="20">-3.2%</text>
      <text x="236" y="108" fill="#e6edf3" font-size="20" text-anchor="end">2180</text>

      <text x="4" y="126" fill="#e6edf3" font-size="20">VOO</text>
      <text x="104" y="126" fill="#3fb950" font-size="20">+7.8%</text>
      <text x="236" y="126" fill="#e6edf3" font-size="20" text-anchor="end">6320</text>

      <text x="4" y="144" fill="#e6edf3" font-size="20">BTC</text>
      <text x="104" y="144" fill="#3fb950" font-size="20">+41.7%</text>
      <text x="236" y="144" fill="#e6edf3" font-size="20" text-anchor="end">8900</text>

      <line x1="4" y1="150" x2="236" y2="150" stroke="#39414d"/>

      <text x="4" y="170" fill="#e6edf3" font-size="20">Total</text>
      <text x="78" y="170" fill="#3fb950" font-size="20">+17.1%</text>
      <text x="236" y="170" fill="#e6edf3" font-size="20" text-anchor="end">$25.2k</text>
    </g>
    <text x="130" y="290" fill="#8b96a5" font-size="14" text-anchor="middle">Portfolio P/L</text>
  </g>
</svg>
