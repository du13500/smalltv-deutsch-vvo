name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# The release-attach step needs write access to create/update the release asset.
permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # restore-keys matters more than the key does. A cold ~/.platformio is not
      # merely slower, it is the one state in which the build breaks (see the
      # SCons note below), and the key is a hash of platformio.ini, so every
      # ordinary edit to that file used to force the broken path and look like
      # the edit's fault. The prefix fallback reuses the last good cache instead.
      # The workflow file is in the key too: it pins the toolchain, so a change
      # here is a toolchain change and deserves a fresh entry.
      #
      # Split into restore + save because actions/cache declares
      # `post-if: success()`, so a red job never writes a cache. That is what
      # made the cold failure self-perpetuating: the run builds the ESP-IDF
      # framework into ~/.platformio, dies at checkprogsize, and throws it away,
      # so the next run is cold and dies the same way. Measured on run
      # 35156418997 (2026-09-16): "Post Cache PlatformIO" skipped. Saving on
      # failure does not fix that build, it only means the re-run is warm and
      # passes, which turns a state CI cannot leave on its own into one retry.
      # `save-always` is not the way to do this: it is deprecated as "does not
      # work as intended" and its message points at this split.
      - name: Restore PlatformIO cache
        id: pio-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', '.github/workflows/build.yml') }}
          restore-keys: |
            pio-${{ runner.os }}-

      # Pinned, because SCons 4.9 dropped SCons.Tool.FortranCommon and the ESP-IDF
      # builder still imports it: unpinned, the envs carrying a custom sdkconfig
      # (smalltv_esp32, smalltv_esp32_wg, smalltv_c2) die with ModuleNotFoundError
      # at checkprogsize, after a successful link. Core selects SCons itself, via
      # a hard "tool-scons" range in platformio/dependencies.py, so installing an
      # older tool-scons alongside does nothing. 6.1.19 asks for ~4.40801.0
      # (SCons 4.8.1, still has the module); 6.2.0 asks for ~4.41101.0
      # (SCons 4.11.1, does not). Only the core version decides, so pin that.
      #
      # `pip install platformio==6.1.19` is NOT enough on its own, which is what
      # this file used to assume. The custom_sdkconfig path rebuilds the IDF libs
      # and, on the way back into the Arduino compile, upgrades PlatformIO itself:
      # the log reads "Please wait while upgrading... Pio has been successfully
      # upgraded to 6.2.0!", and the next two lines install scons-local-4.11.1 over
      # the pinned 4.8.1. That rebuild only runs when ~/.platformio is cold, which
      # is why the pin looked like it worked. Measured on run 35151515742
      # (2026-09-16): cold cache, both ESP-IDF envs dead.
      #
      # The upgrade is pip: platformio/commands/upgrade.py shells out to
      # `python -m pip install --upgrade <spec>`. So PIP_CONSTRAINT reaches it,
      # the subprocess inherits the variable, and the resolve lands back on the
      # version already installed, which makes the upgrade a no-op rather than an
      # error. Revisit when PlatformIO or ESP-IDF stops needing SCons 4.8.
      - name: Pin PlatformIO for every pip in this job
        run: |
          echo 'platformio==6.1.19' > "${{ runner.temp }}/pio-constraints.txt"
          echo "PIP_CONSTRAINT=${{ runner.temp }}/pio-constraints.txt" >> "$GITHUB_ENV"

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Build firmware (all targets)
        run: pio run -e smalltv -e smalltv_lean -e smalltv_c2 -e smalltv_esp32 -e smalltv_esp32_wg -e smalltv_esp32_8mb -e smalltv_loader

      # One app image per target (web-UI OTA + GitHub self-update), the merged
      # factory images for first-time USB flashing of the ESP32 boards, and the
      # minimal loader used to install onto a SmallTV-ultra. Two boards get a
      # second app image: the ESP8266 gets -lean, with Home Assistant and the
      # usage meter compiled out, and the NM-TV-154 gets -esp32-wg, with the
      # WireGuard client compiled in. UPDATE_ASSET in src/config.h maps each
      # build back to its own file name so self-update keeps a device on the
      # variant it runs.
      # always() with a tolerant copy, for the same reason as the upload below:
      # when one env dies the other six still built, and those binaries are
      # usually what the next question needs. A missing file is a warning here,
      # not a reason to hand over nothing. The build step's own exit status still
      # decides whether the run is red.
      - name: Stage artifacts
        if: always()
        run: |
          mkdir -p dist
          copy() { [ -f "$1" ] && cp "$1" "$2" || echo "missing: $1"; }
          copy .pio/build/smalltv/firmware.bin dist/smalltv-mod-firmware.bin
          copy .pio/build/smalltv_lean/firmware.bin dist/smalltv-mod-firmware-lean.bin
          copy .pio/build/smalltv_c2/firmware.bin dist/smalltv-mod-firmware-c2.bin
          copy .pio/build/smalltv_c2/firmware.factory.bin dist/smalltv-mod-firmware-c2.factory.bin
          copy .pio/build/smalltv_esp32/firmware.bin dist/smalltv-mod-firmware-esp32.bin
          copy .pio/build/smalltv_esp32/firmware.factory.bin dist/smalltv-mod-firmware-esp32.factory.bin
          copy .pio/build/smalltv_esp32_wg/firmware.bin dist/smalltv-mod-firmware-esp32-wg.bin
          copy .pio/build/smalltv_esp32_wg/firmware.factory.bin dist/smalltv-mod-firmware-esp32-wg.factory.bin
          copy .pio/build/smalltv_esp32_8mb/firmware.bin dist/smalltv-mod-firmware-esp32-pro.bin
          copy .pio/build/smalltv_esp32_8mb/firmware.factory.bin dist/smalltv-mod-firmware-esp32-pro.factory.bin
          copy .pio/build/smalltv_loader/firmware.bin dist/smalltv-mod-loader.bin

      # always(), so a run that dies after linking still hands over whatever was
      # produced. A size question cannot be answered from a red run with no
      # artifacts, and the step that reports sizes is the one that fails here.
      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smalltv-mod-firmware
          path: dist/
          if-no-files-found: warn

      # generate_release_notes fills the body with the commits and PRs since the
      # previous tag, so a release is never published blank. Editing the release
      # afterwards to write proper notes keeps whatever you put there: the action
      # only sets the body when it creates the release.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      # always(), and last, so a run that dies in the build still hands the next
      # one a warm ~/.platformio. The cache-hit guard covers the exact-key case,
      # where the entry already exists and saving would only warn. The key comes
      # from cache-primary-key rather than a second copy of the expression above,
      # so the two cannot drift.
      - name: Save PlatformIO cache
        if: always() && steps.pio-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ steps.pio-cache.outputs.cache-primary-key }}
