name: Build SmallTV DD

# Baut die Firmware direkt aus dem Repository.
# - Jeder Push auf main und jeder Pull Request: Prüfungen + Firmware als Actions-Artefakt
# - Tag vX.Y… (z. B. v0.4.14.6): zusätzlich GitHub Release mit .bin und Begleitpaket

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

concurrency:
  group: smalltv-firmware-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Firmwareversion ermitteln
        id: version
        run: |
          VERSION=$(sed -n 's/^#define FW_VERSION "\(.*\)"/\1/p' src/main.cpp)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu FW_VERSION $VERSION"
            exit 1
          fi

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Quellen und Display prüfen
        run: |
          python3 tools/check.py
          python3 tools/test_radar.py
          python3 tools/test_policy.py
          python3 tools/test_display.py
          python3 tools/test_brightness.py
          python3 tools/test_diagnostics.py
          python3 tools/test_enrichment.py
          g++ -std=c++11 -Wall -Wextra -Werror tests/test_core.cpp -o /tmp/smalltv-core-test
          /tmp/smalltv-core-test
          node --check tests/webui.cjs

      - name: WebKit-Layoutprüfung
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps webkit
          npm run test:webui

      - name: PlatformIO installieren
        run: pip install platformio==6.1.19

      - name: JSON- und Geo-Speicherschutz prüfen
        run: |
          pio pkg install -e smalltv_ultra
          python3 tools/test_network_json.py
          python3 tools/test_airline_cache.py
          python3 tools/test_vvo_response.py
          python3 tools/test_geo_buffer.py

      - name: ESP8266-Firmware bauen
        run: |
          set -o pipefail
          pio run -e smalltv_ultra 2>&1 | tee build.log

      - name: Ergebnis vorbereiten
        if: always()
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist/firmware dist/begleitpaket
          [ -f build.log ] && cp build.log dist/begleitpaket/build.log
          if [ -f .pio/build/smalltv_ultra/firmware.bin ]; then
            cp .pio/build/smalltv_ultra/firmware.bin "dist/firmware/smalltv-dd-v$V-firmware.bin"
            cp .pio/build/smalltv_ultra/firmware.elf "dist/begleitpaket/smalltv-dd-v$V-firmware.elf"
            cp LICENSE THIRD_PARTY_NOTICES.md RELINKING.md dist/begleitpaket/
            cp -r LICENSES dist/begleitpaket/
            python3 tools/package_build_sources.py . "dist/begleitpaket/smalltv-dd-v$V-build-sources.tar.gz"
            (cd dist/firmware && sha256sum *.bin > sha256.txt)
          fi

      - name: Firmware hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smalltv-dd-v${{ steps.version.outputs.version }}-firmware
          path: dist/firmware/
          if-no-files-found: warn

      - name: Begleitpaket hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smalltv-dd-v${{ steps.version.outputs.version }}-begleitpaket
          path: dist/begleitpaket/
          if-no-files-found: warn

      - name: GitHub Release erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          (cd dist/begleitpaket && zip -qr "../smalltv-dd-v$V-begleitpaket.zip" .)
          gh release create "$GITHUB_REF_NAME" \
            "dist/firmware/smalltv-dd-v$V-firmware.bin" \
            dist/firmware/sha256.txt \
            "dist/smalltv-dd-v$V-begleitpaket.zip" \
            --title "SmallTV DD v$V" \
            --generate-notes \
            --prerelease
