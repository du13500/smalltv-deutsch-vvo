name: Build SmallTV DD v0.4

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'smalltv-deutsch-vvo-v0.4.zip'
      - '.github/workflows/build-v04.yml'

permissions:
  contents: read

jobs:
  build-v04:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: PlatformIO installieren
        run: pip install platformio==6.1.19

      - name: v0.4 entpacken und pruefen
        run: |
          rm -rf /tmp/smalltv-v04
          mkdir -p /tmp/smalltv-v04
          unzip -q smalltv-deutsch-vvo-v0.4.zip -d /tmp/smalltv-v04
          test -f /tmp/smalltv-v04/smalltv-deutsch-vvo-v0.4/platformio.ini
          test -f /tmp/smalltv-v04/smalltv-deutsch-vvo-v0.4/src/main.cpp
          test -f /tmp/smalltv-v04/smalltv-deutsch-vvo-v0.4/src/Vvo.cpp
          test -f /tmp/smalltv-v04/smalltv-deutsch-vvo-v0.4/src/Weather.cpp
          test -f /tmp/smalltv-v04/smalltv-deutsch-vvo-v0.4/src/Flight.cpp
          test -f /tmp/smalltv-v04/smalltv-deutsch-vvo-v0.4/src/TrackFlight.cpp
          grep -q 'MODE_COUNTDOWN4' /tmp/smalltv-v04/smalltv-deutsch-vvo-v0.4/src/main.cpp
          grep -q 'api.aviationstack.com/v1/flights' /tmp/smalltv-v04/smalltv-deutsch-vvo-v0.4/src/TrackFlight.cpp

      - name: ESP8266-Firmware bauen
        working-directory: /tmp/smalltv-v04/smalltv-deutsch-vvo-v0.4
        run: |
          set -o pipefail
          pio run -e smalltv_ultra 2>&1 | tee build.log

      - name: Ergebnis vorbereiten
        if: always()
        run: |
          mkdir -p dist
          if [ -f /tmp/smalltv-v04/smalltv-deutsch-vvo-v0.4/build.log ]; then
            cp /tmp/smalltv-v04/smalltv-deutsch-vvo-v0.4/build.log dist/build.log
          fi
          if [ -f /tmp/smalltv-v04/smalltv-deutsch-vvo-v0.4/.pio/build/smalltv_ultra/firmware.bin ]; then
            cp /tmp/smalltv-v04/smalltv-deutsch-vvo-v0.4/.pio/build/smalltv_ultra/firmware.bin dist/smalltv-dd-v0.4-firmware.bin
            echo "Firmware size:"
            stat -c '%s bytes' dist/smalltv-dd-v0.4-firmware.bin
          fi

      - name: Build-Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smalltv-dd-v0.4
          path: dist/
          if-no-files-found: warn
