name: Build SmallTV DD v0.4.1

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'smalltv-deutsch-vvo-v0.4.1.zip'
      - '.github/workflows/build-v041.yml'

permissions:
  contents: read

jobs:
  build-v041:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: PlatformIO installieren
        run: pip install platformio==6.1.19

      - name: v0.4.1 entpacken und pruefen
        run: |
          rm -rf /tmp/smalltv-v041
          mkdir -p /tmp/smalltv-v041
          unzip -q smalltv-deutsch-vvo-v0.4.1.zip -d /tmp/smalltv-v041
          test -f /tmp/smalltv-v041/smalltv-deutsch-vvo-v0.4.1/platformio.ini
          test -f /tmp/smalltv-v041/smalltv-deutsch-vvo-v0.4.1/src/main.cpp
          test -f /tmp/smalltv-v041/smalltv-deutsch-vvo-v0.4.1/src/Vvo.cpp
          test -f /tmp/smalltv-v041/smalltv-deutsch-vvo-v0.4.1/src/Weather.cpp
          test -f /tmp/smalltv-v041/smalltv-deutsch-vvo-v0.4.1/src/Flight.cpp
          test -f /tmp/smalltv-v041/smalltv-deutsch-vvo-v0.4.1/src/TrackFlight.cpp
          test -f /tmp/smalltv-v041/smalltv-deutsch-vvo-v0.4.1/src/Geo.cpp
          grep -q 'FW_VERSION "0.4.1"' /tmp/smalltv-v041/smalltv-deutsch-vvo-v0.4.1/src/main.cpp
          grep -q '/api/wifi/scan' /tmp/smalltv-v041/smalltv-deutsch-vvo-v0.4.1/src/main.cpp
          grep -q '/api/geo/search' /tmp/smalltv-v041/smalltv-deutsch-vvo-v0.4.1/src/main.cpp
          grep -q 'rotationMask' /tmp/smalltv-v041/smalltv-deutsch-vvo-v0.4.1/src/main.cpp
          grep -q 'api.adsbdb.com/v0/callsign/' /tmp/smalltv-v041/smalltv-deutsch-vvo-v0.4.1/src/Flight.cpp

      - name: ESP8266-Firmware bauen
        working-directory: /tmp/smalltv-v041/smalltv-deutsch-vvo-v0.4.1
        run: |
          set -o pipefail
          pio run -e smalltv_ultra 2>&1 | tee build.log

      - name: Ergebnis vorbereiten
        if: always()
        run: |
          mkdir -p dist
          if [ -f /tmp/smalltv-v041/smalltv-deutsch-vvo-v0.4.1/build.log ]; then
            cp /tmp/smalltv-v041/smalltv-deutsch-vvo-v0.4.1/build.log dist/build.log
          fi
          if [ -f /tmp/smalltv-v041/smalltv-deutsch-vvo-v0.4.1/.pio/build/smalltv_ultra/firmware.bin ]; then
            cp /tmp/smalltv-v041/smalltv-deutsch-vvo-v0.4.1/.pio/build/smalltv_ultra/firmware.bin dist/smalltv-dd-v0.4.1-firmware.bin
            echo "Firmware size:"
            stat -c '%s bytes' dist/smalltv-dd-v0.4.1-firmware.bin
            sha256sum dist/smalltv-dd-v0.4.1-firmware.bin | tee dist/sha256.txt
          fi

      - name: Build-Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smalltv-dd-v0.4.1
          path: dist/
          if-no-files-found: warn
